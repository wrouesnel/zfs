. $STF_SUITE/include/libtest.shlib

export SIZE=1G
export VDIR=$TESTDIR/disk.l2arc
export VDEV="$VDIR/a"
export VDEV_CACHE="$VDIR/b"
export VDEV_CACHE2="$VDIR/c"
export VDEV1="$VDIR/d"

# fio options
export DIRECTORY=/$TESTPOOL
export NUMJOBS=4
export RUNTIME=10
export PERF_RANDSEED=1234
export PERF_COMPPERCENT=66
export PERF_COMPCHUNK=0
export BLOCKSIZE=128K
export SYNC_TYPE=0
export DIRECT=0

#
# The L2ARC rebuild gives up as soon as the ARC reports that the system is
# low on memory (arc_reclaim_needed(), counted in arcstat l2_rebuild_lowmem),
# and the reads of these tests fill the ARC.  Exporting the pool frees its
# buffers, but the memory comes back only after the ARC has reaped it.
# Before an import or an online that starts a rebuild, wait for the ARC to
# report memory available, so that the rebuild restores every log block.
#
function wait_l2arc_rebuild_memory
{
	typeset avail
	typeset i

	for i in {1..60}; do
		avail=$(kstat arcstats.memory_available_bytes)
		(( avail > 64 * 1024 * 1024 )) && return
		sleep 1
	done
	log_note "ARC memory_available_bytes still $avail after 60s"
}

#
# Print how many L2ARC rebuilds have ended, successfully or not.
#
function l2arc_rebuilds_ended
{
	typeset n=0
	typeset stat

	for stat in success unsupported io_errors dh_errors cksum_lb_errors \
	    lowmem; do
		n=$((n + $(kstat arcstats.l2_rebuild_$stat)))
	done
	echo $n
}

#
# Wait up to 60 seconds for a rebuild to end after l2arc_rebuilds_ended
# printed $1, and fail with the reason if it stopped for low memory since
# l2_rebuild_lowmem was $2.  A rebuild that stops at its first log block
# leaves l2_size at 0, which arcstat_quiescence would wait on forever.
#
function wait_l2arc_rebuild # ended_start lowmem_start
{
	typeset i

	for i in {1..60}; do
		(( $(l2arc_rebuilds_ended) > $1 )) && break
		sleep 1
	done

	typeset lowmem=$(kstat arcstats.l2_rebuild_lowmem)
	if [[ $lowmem -ne $2 ]]; then
		log_fail "L2ARC rebuild stopped for low memory" \
		    "(l2_rebuild_lowmem $2 -> $lowmem," \
		    "memory_available_bytes" \
		    "$(kstat arcstats.memory_available_bytes))"
	fi
}
